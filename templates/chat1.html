<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💙 BlueCircle Chat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f9fb; padding: 20px; }
    h1 { color: #007BFF; }
    #chat-box { border: 1px solid #ccc; padding: 10px; background: white; height: 400px; overflow-y: auto; }
    .user { color: #444; margin: 8px 0; }
    .bot { color: #007BFF; margin: 8px 0; }
    #input-box { width: 80%; padding: 10px; }
    #send-btn { padding: 10px 15px; background: #007BFF; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>💙 BlueCircle AI</h1>
  <div id="chat-box"></div>
  <input id="input-box" type="text" placeholder="Type your message..." />
  <button id="send-btn">Send</button>

  <script>
    const sendBtn = document.getElementById('send-btn');
    const inputBox = document.getElementById('input-box');
    const chatBox = document.getElementById('chat-box');

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = role;
      div.textContent = (role === 'user' ? '🧑 You: ' : '💙 BlueCircle: ') + text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.onclick = async () => {
      const message = inputBox.value.trim();
      if (!message) return;
      appendMessage('user', message);
      inputBox.value = '';
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      appendMessage('bot', data.response);
    };
  </script>
</body>
</html>
